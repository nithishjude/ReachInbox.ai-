services:
  postgres:
    image: postgres:16-alpine
    container_name: reachinbox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: reachinbox
      POSTGRES_PASSWORD: reachinbox
      POSTGRES_DB: reachinbox
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reachinbox"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: reachinbox-redis
    restart: unless-stopped
    # AOF persistence (fsync every second) so delayed jobs survive a Redis restart too.
    # noeviction is required by BullMQ: evicting queue keys would silently lose jobs.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10


  # ---------- Application (opt-in): docker compose --profile app up --build ----------
  # Reads secrets from backend/.env; infra hostnames are overridden for the container network.
  api:
    profiles: ["app"]
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment: &app-env
      DATABASE_URL: postgres://reachinbox:reachinbox@postgres:5432/reachinbox
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://localhost:8080
      GOOGLE_REDIRECT_URI: http://localhost:8080/api/auth/google/callback
      RUN_WORKER_IN_API: "false"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    profiles: ["app"]
    build: ./backend
    command: ["node", "dist/workerMain.js"]
    restart: unless-stopped
    env_file: ./backend/.env
    environment: *app-env
    deploy:
      replicas: 2 # two independent workers share the queue; limits stay global via Redis
    depends_on:
      api: { condition: service_started } # API applies migrations first

  web:
    profiles: ["app"]
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
